#===============================================================================================
#-------------------------------------
#---    IBMCEPH-14352 NFS rados command timeout ---
#-------------------------------------
# Conf: conf/tentacle/nfs/1admin-7node-3client.yaml
# 1. Create one NFS (seed, creates .nfs).
# 2. Default 30: get must be 30 (else set 30, still measure health, then Fail).
#    Pause → add new NFS cluster using spec → health 30s → unpause.
# 3. set 60 → get 60 → pause → health 60.0.
# 4. set 5 → health 5.0.
# 5. set 0 → get must be 0 or 1 (not leftover 5) → health 5.0.
# Each timeout apply uses a unique service_id and ports.
# Not label-rm / host down / IBMCEPH-14241 HA.
# Bootstrap + CephFS match other tentacle NFS suites.
#
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      desc: bootstrap and deploy services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      name: IBMCEPH-14352 setup default NFS
      module: test_nfs_rados_command_timeout.py
      desc: Apply one healthy NFS cluster and leave it running (creates pool .nfs)
      abort-on-fail: true
      comments: IBMCEPH-14352
      config:
        mode: setup
        service_id: nfs-14352-seed
        port: 62100
        monitoring_port: 62600
        cluster_qos_port: 63100

  - test:
      name: IBMCEPH-14352 default timeout 30s
      module: test_nfs_rados_command_timeout.py
      desc: >-
        get must be 30 (else Fail after measuring 30s health); pause; add new NFS cluster using spec; health 30s
      abort-on-fail: false
      comments: IBMCEPH-14352
      config:
        mode: timeout
        service_id: nfs-14352-stall-30
        seed_service_id: nfs-14352-seed
        port: 62110
        monitoring_port: 62610
        cluster_qos_port: 63110
        expect: 30.0
        get_ok:
          - "30"
        strict_get: true

  - test:
      name: IBMCEPH-14352 timeout set 60s
      module: test_nfs_rados_command_timeout.py
      desc: >-
        config set 60; pause; new NFS; health timed out after 60.0 seconds; unpause
      abort-on-fail: false
      comments: IBMCEPH-14352
      config:
        mode: timeout
        service_id: nfs-14352-stall-60
        seed_service_id: nfs-14352-seed
        port: 62120
        monitoring_port: 62620
        cluster_qos_port: 63120
        set_value: 60
        expect: 60.0
        get_ok:
          - "60"
        strict_get: true

  - test:
      name: IBMCEPH-14352 timeout floor 5s
      module: test_nfs_rados_command_timeout.py
      desc: >-
        config set 5; pause; new NFS; health timed out after 5.0 seconds; unpause
      abort-on-fail: false
      comments: IBMCEPH-14352
      config:
        mode: timeout
        service_id: nfs-14352-stall-5
        seed_service_id: nfs-14352-seed
        port: 62130
        monitoring_port: 62630
        cluster_qos_port: 63130
        set_value: 5
        expect: 5.0
        get_ok:
          - "5"
        strict_get: true

  - test:
      name: IBMCEPH-14352 timeout below floor 0s
      module: test_nfs_rados_command_timeout.py
      desc: >-
        config set 0; get must be 0 or 1 (not leftover 5); health 5.0; unpause
      abort-on-fail: false
      comments: IBMCEPH-14352
      config:
        mode: timeout
        service_id: nfs-14352-stall-0
        seed_service_id: nfs-14352-seed
        port: 62140
        monitoring_port: 62640
        cluster_qos_port: 63140
        set_value: 0
        expect: 5.0
        get_ok:
          - "0"
          - "1"
        strict_get: true

  - test:
      name: IBMCEPH-14352 teardown
      module: test_nfs_rados_command_timeout.py
      desc: Unpause OSDs, config set timeout 30, orch rm seed and stall NFS
      abort-on-fail: false
      comments: IBMCEPH-14352
      config:
        mode: teardown
        service_id: nfs-14352-seed
        stall_service_ids:
          - nfs-14352-stall-30
          - nfs-14352-stall-60
          - nfs-14352-stall-5
          - nfs-14352-stall-0
